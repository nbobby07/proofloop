name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -e ".[dev]" -c requirements.lock
      - run: python -m pytest
      - run: python -m ruff check backend scripts demo_target verifier_tests sandbox
      - run: python -m ruff format --check backend scripts demo_target verifier_tests sandbox
      - run: python -m scripts.export_contracts --check

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run contracts
      - run: git diff --exit-code -- src/types/api.generated.ts
      - run: npm run lint
      - run: npm run build

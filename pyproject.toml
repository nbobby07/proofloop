[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "proofloop"
version = "0.1.0"
description = "Autonomous adversarial security verification — foundation scaffold"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
akash = ["websockets==16.1.1", "cryptography==48.0.1"]
dev = ["pytest>=8,<10", "httpx2>=2.13,<3", "ruff>=0.12,<1", "jsonschema>=4.23,<5"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "backend/providers/tests", "sandbox/tests", "backend/reports/tests", "backend/telemetry/tests", "guild/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
# Preserve the exact API-generated specimen and its original bytes for provenance.
extend-exclude = ["demo_target/ledgerlite_workspace/app.py", "demo_target/ledgerlite_workspace/original"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
